<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — The Study Website</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0f;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
  }

  /* ── Login Screen ── */
  #login-screen {
    position: fixed; inset: 0;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }

  #login-screen.hidden { display: none; }

  .login-box {
    background: #111118;
    border: 1px solid #2d2d44;
    border-radius: 16px;
    padding: 40px 36px;
    width: 360px;
  }

  .login-box h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
    color: #e2e8f0;
  }

  .login-box p {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 28px;
  }

  .login-box label {
    font-size: 12px;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: block;
    margin-bottom: 6px;
  }

  .login-box input {
    width: 100%;
    background: #1a1a2e;
    border: 1px solid #2d2d44;
    border-radius: 8px;
    padding: 10px 14px;
    color: #e2e8f0;
    font-size: 14px;
    outline: none;
    margin-bottom: 20px;
  }

  .login-box input:focus { border-color: #6366f1; }

  .login-box button {
    width: 100%;
    background: #6366f1;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .login-box button:hover { background: #4f46e5; }

  #login-error {
    color: #f87171;
    font-size: 12px;
    margin-top: 12px;
    text-align: center;
    min-height: 18px;
  }

  /* ── App layout ── */
  #app { display: flex; width: 100%; }
  #app.hidden { display: none; }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px;
    min-width: 280px;
    background: #111118;
    border-right: 1px solid #1e1e2e;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    position: sticky;
    top: 0;
  }

  #sidebar-header {
    padding: 16px 16px 12px;
    border-bottom: 1px solid #1e1e2e;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #sidebar-header h2 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6366f1;
  }

  #sidebar-header p { font-size: 11px; color: #64748b; }

  #logout-btn {
    background: none;
    border: 1px solid #2d2d44;
    border-radius: 6px;
    color: #64748b;
    font-size: 11px;
    padding: 4px 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  #logout-btn:hover { border-color: #f87171; color: #f87171; }

  #stats-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid #1e1e2e;
  }

  .stat-chip {
    background: #1a1a2e;
    border: 1px solid #2d2d44;
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
  }
  .stat-chip .val { font-size: 20px; font-weight: 700; color: #818cf8; line-height: 1; }
  .stat-chip .lbl { font-size: 10px; color: #64748b; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }

  #user-search { padding: 10px 16px; border-bottom: 1px solid #1e1e2e; }

  #user-search input {
    width: 100%;
    background: #1a1a2e;
    border: 1px solid #2d2d44;
    border-radius: 8px;
    padding: 7px 12px;
    color: #e2e8f0;
    font-size: 13px;
    outline: none;
  }
  #user-search input::placeholder { color: #475569; }
  #user-search input:focus { border-color: #6366f1; }

  #user-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  #user-list::-webkit-scrollbar { width: 4px; }
  #user-list::-webkit-scrollbar-thumb { background: #2d2d44; border-radius: 2px; }

  .user-item {
    padding: 10px 12px 10px 16px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .user-item:hover { background: #1a1a2e; border-left-color: #4f4f7a; }
  .user-item.active { background: #1e1e3f; border-left-color: #6366f1; }

  .user-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #818cf8);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: white;
    flex-shrink: 0; overflow: hidden;
  }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .user-meta { overflow: hidden; flex: 1; }
  .user-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-email { font-size: 11px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .del-user-btn {
    background: none;
    border: none;
    color: #3d3d3d;
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    font-size: 14px;
    flex-shrink: 0;
    line-height: 1;
    transition: color 0.15s;
    opacity: 0;
  }
  .user-item:hover .del-user-btn { opacity: 1; }
  .del-user-btn:hover { color: #f87171 !important; }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; padding: 24px; }
  #main::-webkit-scrollbar { width: 6px; }
  #main::-webkit-scrollbar-thumb { background: #2d2d44; border-radius: 3px; }

  #placeholder {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 80vh; color: #475569; text-align: center;
  }
  #placeholder svg { opacity: 0.2; margin-bottom: 16px; }
  #placeholder h3 { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
  #placeholder p { font-size: 13px; }

  /* ── User Detail ── */
  #user-detail { display: none; }

  .detail-header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 24px; padding-bottom: 20px;
    border-bottom: 1px solid #1e1e2e;
    justify-content: space-between;
  }

  .detail-header-left { display: flex; align-items: center; gap: 16px; }

  .detail-avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #818cf8);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 600; color: white;
    overflow: hidden; flex-shrink: 0;
  }
  .detail-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .detail-info h2 { font-size: 20px; font-weight: 600; }
  .detail-info p { font-size: 13px; color: #64748b; margin-top: 2px; }

  .detail-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .badge { background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 20px; padding: 2px 10px; font-size: 11px; color: #94a3b8; }

  .delete-user-big {
    background: #2e1e1e;
    border: 1px solid #5f1e1e;
    color: #f87171;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .delete-user-big:hover { background: #3e1e1e; border-color: #f87171; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #1e1e2e; margin-bottom: 20px; }

  .tab-btn {
    background: none; border: none; color: #64748b;
    padding: 10px 16px; font-size: 13px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: all 0.15s; display: flex; align-items: center; gap: 6px;
  }
  .tab-btn:hover { color: #94a3b8; }
  .tab-btn.active { color: #818cf8; border-bottom-color: #6366f1; }
  .tab-count { background: #2d2d44; border-radius: 10px; padding: 1px 6px; font-size: 10px; }
  .tab-btn.active .tab-count { background: #3d3d6e; color: #a5b4fc; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Cards shared ── */
  .item-card {
    background: #111118;
    border: 1px solid #1e1e2e;
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .item-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .item-header:hover { background: #1a1a2e; }
  .item-card.expanded .item-header { background: #1a1a2e; }

  .item-icon {
    width: 32px; height: 32px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }

  .file-icon-bg { background: #1e1e3f; border: 1px solid #2d2d44; }
  .chat-icon-bg { background: #1e2e1e; border: 1px solid #2d442d; }
  .out-icon-bg  { background: #2e1e3e; border: 1px solid #4a1e5f; }

  .item-info { flex: 1; overflow: hidden; }
  .item-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 11px; color: #64748b; margin-top: 1px; }

  .item-chevron { font-size: 11px; color: #475569; transition: transform 0.2s; display: flex; align-items: center; }
  .item-card.expanded .item-chevron { transform: rotate(180deg); }

  .del-btn {
    background: none;
    border: 1px solid transparent;
    color: #3d3d3d;
    cursor: pointer;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 13px;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .del-btn:hover { color: #f87171; border-color: #5f1e1e; background: #2e1e1e; }

  /* ── Expanded content ── */
  .item-body {
    display: none;
    border-top: 1px solid #1e1e2e;
    background: #0d0d14;
  }
  .item-card.expanded .item-body { display: block; }

  .file-text {
    padding: 14px 16px;
    font-size: 12px;
    color: #94a3b8;
    line-height: 1.7;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-family: 'Courier New', monospace;
  }

  /* ── Chat messages ── */
  .chat-messages {
    padding: 12px 16px;
    max-height: 500px;
    overflow-y: auto;
  }

  .msg { margin-bottom: 14px; }
  .msg-role { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 4px; }
  .msg.user .msg-role { color: #60a5fa; }
  .msg.assistant .msg-role { color: #34d399; }

  .msg-bubble {
    font-size: 13px; line-height: 1.6; color: #cbd5e1;
    padding: 10px 12px; border-radius: 8px; white-space: pre-wrap;
  }
  .msg.user .msg-bubble { background: #1e2a3e; border: 1px solid #1e3a5f; }
  .msg.assistant .msg-bubble { background: #1a2e1a; border: 1px solid #1e4a1e; }
  .msg-time { font-size: 10px; color: #475569; margin-top: 4px; }

  /* ── Output content ── */
  .output-content {
    padding: 14px 16px;
    font-size: 12px;
    color: #94a3b8;
    line-height: 1.7;
    max-height: 400px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-family: 'Courier New', monospace;
  }

  .output-type-badge {
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600; text-transform: capitalize; white-space: nowrap;
  }
  .type-summary    { background: #1e2e3e; color: #60a5fa;  border: 1px solid #1e3a5f; }
  .type-flashcards { background: #2e1e3e; color: #c084fc;  border: 1px solid #4a1e5f; }
  .type-quiz       { background: #2e2e1e; color: #fbbf24;  border: 1px solid #5f4a1e; }
  .type-key_points { background: #1e2e1e; color: #34d399;  border: 1px solid #1e4a1e; }
  .type-explain    { background: #2e1e1e; color: #f87171;  border: 1px solid #5f1e1e; }
  .type-custom     { background: #1e1e2e; color: #818cf8;  border: 1px solid #2d2d44; }
  .type-cornell    { background: #2e1e2e; color: #e879f9;  border: 1px solid #5f1e5f; }

  /* ── Bio ── */
  .bio-box {
    background: #111118; border: 1px solid #1e1e2e;
    border-radius: 10px; padding: 14px 16px; margin-bottom: 20px;
    font-size: 13px; color: #94a3b8; font-style: italic; line-height: 1.6;
  }

  /* ── Empty / Loading ── */
  .empty { text-align: center; padding: 40px 20px; color: #475569; font-size: 13px; }
  .empty svg { margin-bottom: 10px; opacity: 0.3; display: block; margin-left: auto; margin-right: auto; }

  .loading {
    text-align: center; padding: 30px; color: #64748b; font-size: 13px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #2d2d44; border-top-color: #6366f1;
    border-radius: 50%; animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Confirm modal ── */
  #confirm-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  #confirm-modal.hidden { display: none; }

  .confirm-box {
    background: #161620;
    border: 1px solid #2d2d44;
    border-radius: 12px;
    padding: 28px 28px 24px;
    width: 380px;
    text-align: center;
  }
  .confirm-box .icon { font-size: 32px; margin-bottom: 12px; }
  .confirm-box h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .confirm-box p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
  .confirm-actions { display: flex; gap: 10px; justify-content: center; }

  .btn-cancel {
    background: #1a1a2e; border: 1px solid #2d2d44;
    color: #94a3b8; border-radius: 8px; padding: 9px 20px;
    font-size: 13px; cursor: pointer; transition: all 0.15s;
  }
  .btn-cancel:hover { border-color: #4f4f7a; color: #e2e8f0; }

  .btn-confirm-del {
    background: #991b1b; border: 1px solid #7f1d1d;
    color: white; border-radius: 8px; padding: 9px 20px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .btn-confirm-del:hover { background: #b91c1c; }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #1e1e3f; border: 1px solid #4f4f7a;
    color: #e2e8f0; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; z-index: 9998;
    transition: opacity 0.3s;
  }
  #toast.hidden { opacity: 0; pointer-events: none; }
  #toast.error { background: #2e1e1e; border-color: #5f1e1e; color: #f87171; }

  /* scrollbars inside cards */
  .chat-messages::-webkit-scrollbar,
  .file-text::-webkit-scrollbar,
  .output-content::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb,
  .file-text::-webkit-scrollbar-thumb,
  .output-content::-webkit-scrollbar-thumb { background: #2d2d44; border-radius: 2px; }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <h1>Admin Dashboard</h1>
    <p>The Study Website — restricted access</p>
    <label for="pw-input">Password</label>
    <input type="password" id="pw-input" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Sign in</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">

  <!-- Sidebar -->
  <nav id="sidebar">
    <div id="sidebar-header">
      <div>
        <h2>Admin Dashboard</h2>
        <p>The Study Website</p>
      </div>
      <button id="logout-btn" onclick="doLogout()">Logout</button>
    </div>

    <div id="stats-bar">
      <div class="stat-chip"><div class="val" id="stat-users">–</div><div class="lbl">Users</div></div>
      <div class="stat-chip"><div class="val" id="stat-files">–</div><div class="lbl">Files</div></div>
      <div class="stat-chip"><div class="val" id="stat-sessions">–</div><div class="lbl">Chats</div></div>
      <div class="stat-chip"><div class="val" id="stat-messages">–</div><div class="lbl">Messages</div></div>
    </div>

    <div id="user-search">
      <input type="text" id="search-input" placeholder="Search users…" oninput="filterUsers(this.value)">
    </div>

    <div id="user-list">
      <div class="loading"><div class="spinner"></div> Loading users…</div>
    </div>
  </nav>

  <!-- Main -->
  <main id="main">
    <div id="placeholder">
      <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
      <h3>Select a user</h3>
      <p>Click any user in the sidebar to view their details</p>
    </div>

    <div id="user-detail">
      <div class="detail-header">
        <div class="detail-header-left">
          <div class="detail-avatar" id="detail-avatar"></div>
          <div class="detail-info">
            <h2 id="detail-name"></h2>
            <p id="detail-email"></p>
            <div class="detail-badges" id="detail-badges"></div>
          </div>
        </div>
        <button class="delete-user-big" onclick="confirmDeleteUser()">🗑 Delete User</button>
      </div>

      <div id="detail-bio" class="bio-box" style="display:none"></div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('files')">📁 Files <span class="tab-count" id="cnt-files">0</span></button>
        <button class="tab-btn" onclick="switchTab('chats')">💬 Chats <span class="tab-count" id="cnt-chats">0</span></button>
        <button class="tab-btn" onclick="switchTab('outputs')">✨ Outputs <span class="tab-count" id="cnt-outputs">0</span></button>
      </div>

      <div id="tab-files" class="tab-panel active">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
      <div id="tab-chats" class="tab-panel">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
      <div id="tab-outputs" class="tab-panel">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>
  </main>
</div>

<!-- Confirm Modal -->
<div id="confirm-modal" class="hidden">
  <div class="confirm-box">
    <div class="icon">⚠️</div>
    <h3 id="confirm-title">Are you sure?</h3>
    <p id="confirm-msg">This action cannot be undone.</p>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="btn-confirm-del" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden"></div>

<script>
const BASE = "http://localhost:5001";
let TOKEN = sessionStorage.getItem("admin_token") || "";
let allUsers = [];
let currentUser = null;

// ── Auth ──────────────────────────────────────────────────────────────────────

async function doLogin() {
  const pw = document.getElementById("pw-input").value;
  const err = document.getElementById("login-error");
  err.textContent = "";
  try {
    const r = await fetch(`${BASE}/api/admin/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw })
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = "Wrong password."; return; }
    TOKEN = d.token;
    sessionStorage.setItem("admin_token", TOKEN);
    showApp();
  } catch (e) {
    err.textContent = "Could not reach server.";
  }
}

async function doLogout() {
  await api("POST", "/api/admin/logout");
  TOKEN = "";
  sessionStorage.removeItem("admin_token");
  location.reload();
}

function showApp() {
  document.getElementById("login-screen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  loadStats();
  loadUsers();
}

// Check existing token on load
(async () => {
  if (TOKEN) {
    const r = await fetch(`${BASE}/api/admin/stats`, { headers: { "X-Admin-Token": TOKEN } });
    if (r.ok) { showApp(); return; }
    TOKEN = ""; sessionStorage.removeItem("admin_token");
  }
})();

// ── API helper ────────────────────────────────────────────────────────────────

async function api(method, path, body) {
  const opts = {
    method,
    headers: { "X-Admin-Token": TOKEN }
  };
  if (body) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(BASE + path, opts);
  if (r.status === 401) { doLogout(); throw new Error("Unauthorized"); }
  return r;
}

// ── Toast ─────────────────────────────────────────────────────────────────────

let _toastTimer;
function toast(msg, isError) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = isError ? "error" : "";
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.add("hidden"), 3000);
}

// ── Confirm modal ─────────────────────────────────────────────────────────────

function confirm(title, msg, onOk) {
  document.getElementById("confirm-title").textContent = title;
  document.getElementById("confirm-msg").textContent = msg;
  const modal = document.getElementById("confirm-modal");
  modal.classList.remove("hidden");
  const btn = document.getElementById("confirm-ok");
  btn.onclick = () => { closeConfirm(); onOk(); };
}

function closeConfirm() {
  document.getElementById("confirm-modal").classList.add("hidden");
}

// ── Utils ─────────────────────────────────────────────────────────────────────

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function fmtSize(b) {
  if (!b) return "–";
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b/1024).toFixed(1) + " KB";
  return (b/1048576).toFixed(1) + " MB";
}

function fmtDate(s) {
  if (!s || s === "None") return "–";
  try { return new Date(s).toLocaleString(); } catch { return s; }
}

function fmtRelTime(s) {
  if (!s || s === "None") return "";
  try {
    const m = Math.floor((Date.now() - new Date(s)) / 60000);
    if (m < 1) return "just now";
    if (m < 60) return m + "m ago";
    const h = Math.floor(m / 60);
    if (h < 24) return h + "h ago";
    return Math.floor(h / 24) + "d ago";
  } catch { return ""; }
}

function initials(name, email) {
  if (name) return name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
  return (email || "?")[0].toUpperCase();
}

function fileIcon(name) {
  const ext = (name || "").split(".").pop().toLowerCase();
  if (ext === "pdf") return "📄";
  if (ext === "docx" || ext === "doc") return "📝";
  if (ext === "md") return "📋";
  return "📃";
}

// ── Stats ─────────────────────────────────────────────────────────────────────

async function loadStats() {
  try {
    const r = await api("GET", "/api/admin/stats");
    const d = await r.json();
    document.getElementById("stat-users").textContent = d.total_users ?? "–";
    document.getElementById("stat-files").textContent = d.total_files ?? "–";
    document.getElementById("stat-sessions").textContent = d.total_sessions ?? "–";
    document.getElementById("stat-messages").textContent = d.total_messages ?? "–";
  } catch {}
}

// ── Users ─────────────────────────────────────────────────────────────────────

async function loadUsers() {
  try {
    const r = await api("GET", "/api/admin/users");
    if (!r.ok) throw new Error((await r.json()).error);
    allUsers = await r.json();
    renderUserList(allUsers);
  } catch (e) {
    document.getElementById("user-list").innerHTML =
      `<div class="empty" style="color:#f87171">Error: ${e.message}</div>`;
  }
}

function renderUserList(users) {
  const el = document.getElementById("user-list");
  if (!users.length) { el.innerHTML = `<div class="empty">No users found</div>`; return; }
  el.innerHTML = users.map(u => `
    <div class="user-item${u.id === currentUser?.id ? " active" : ""}"
         data-uid="${u.id}" onclick="selectUser(this.dataset.uid)">
      <div class="user-avatar">
        ${u.avatar_url
          ? `<img src="${u.avatar_url}" onerror="this.style.display='none'">`
          : initials(u.full_name, u.email)}
      </div>
      <div class="user-meta">
        <div class="user-name">${escHtml(u.full_name || u.email.split("@")[0])}</div>
        <div class="user-email">${escHtml(u.email)}</div>
      </div>
      <button class="del-user-btn" title="Delete user"
        onclick="event.stopPropagation(); confirmDeleteUserById('${u.id}', '${escHtml(u.email)}')">🗑</button>
    </div>
  `).join("");
}

function filterUsers(q) {
  const filtered = allUsers.filter(u =>
    u.email.toLowerCase().includes(q.toLowerCase()) ||
    (u.full_name || "").toLowerCase().includes(q.toLowerCase())
  );
  renderUserList(filtered);
}

// ── Select user ───────────────────────────────────────────────────────────────

async function selectUser(userId) {
  currentUser = allUsers.find(u => u.id === userId);
  if (!currentUser) return;

  document.querySelectorAll(".user-item").forEach(el => el.classList.remove("active"));
  document.querySelector(`.user-item[data-uid="${userId}"]`)?.classList.add("active");

  document.getElementById("placeholder").style.display = "none";
  document.getElementById("user-detail").style.display = "block";

  const av = document.getElementById("detail-avatar");
  av.innerHTML = currentUser.avatar_url
    ? `<img src="${currentUser.avatar_url}">`
    : initials(currentUser.full_name, currentUser.email);

  document.getElementById("detail-name").textContent =
    currentUser.full_name || currentUser.email.split("@")[0];
  document.getElementById("detail-email").textContent = currentUser.email;

  const badges = [];
  if (currentUser.school_board) badges.push(currentUser.school_board);
  if (currentUser.grade_major) badges.push(currentUser.grade_major);
  badges.push("Joined " + fmtDate(currentUser.created_at).split(",")[0]);
  if (currentUser.last_sign_in_at) badges.push("Last seen " + fmtRelTime(currentUser.last_sign_in_at));
  document.getElementById("detail-badges").innerHTML = badges.map(b => `<span class="badge">${escHtml(b)}</span>`).join("");

  const bioEl = document.getElementById("detail-bio");
  if (currentUser.bio_message) {
    bioEl.textContent = `"${currentUser.bio_message}"`;
    bioEl.style.display = "block";
  } else {
    bioEl.style.display = "none";
  }

  switchTab("files");
  loadFiles(userId);
  loadChats(userId);
  loadOutputs(userId);
}

// ── Tabs ──────────────────────────────────────────────────────────────────────

function switchTab(name) {
  const names = ["files", "chats", "outputs"];
  document.querySelectorAll(".tab-btn").forEach((b, i) => b.classList.toggle("active", names[i] === name));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.getElementById(`tab-${name}`).classList.add("active");
}

// ── Files ─────────────────────────────────────────────────────────────────────

async function loadFiles(userId) {
  const panel = document.getElementById("tab-files");
  panel.innerHTML = `<div class="loading"><div class="spinner"></div> Loading…</div>`;
  try {
    const r = await api("GET", `/api/admin/users/${userId}/files`);
    const files = await r.json();
    document.getElementById("cnt-files").textContent = files.length;
    if (!files.length) {
      panel.innerHTML = `<div class="empty"><svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>No files uploaded</div>`;
      return;
    }
    panel.innerHTML = files.map(f => `
      <div class="item-card" id="fc-${f.id}">
        <div class="item-header">
          <div class="item-icon file-icon-bg" onclick="toggleCard('fc-${f.id}')">${fileIcon(f.filename)}</div>
          <div class="item-info" onclick="toggleCard('fc-${f.id}')">
            <div class="item-name">${escHtml(f.filename)}</div>
            <div class="item-meta">${fmtSize(f.size)} · ${fmtDate(f.uploaded_at)}</div>
          </div>
          <button class="del-btn" onclick="confirmDeleteFile('${f.id}', '${escHtml(f.filename)}')" title="Delete file">🗑</button>
          <div class="item-chevron" onclick="toggleCard('fc-${f.id}')">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
        <div class="item-body">
          <div class="file-text">${f.text_content
            ? escHtml(f.text_content.trim())
            : '<span style="color:#475569;font-style:italic">No text content extracted.</span>'}</div>
        </div>
      </div>
    `).join("");
  } catch (e) {
    panel.innerHTML = `<div class="empty" style="color:#f87171">Error: ${e.message}</div>`;
  }
}

// ── Chats ─────────────────────────────────────────────────────────────────────

async function loadChats(userId) {
  const panel = document.getElementById("tab-chats");
  panel.innerHTML = `<div class="loading"><div class="spinner"></div> Loading…</div>`;
  try {
    const r = await api("GET", `/api/admin/users/${userId}/chats`);
    const sessions = await r.json();
    document.getElementById("cnt-chats").textContent = sessions.length;
    if (!sessions.length) {
      panel.innerHTML = `<div class="empty"><svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>No chat sessions</div>`;
      return;
    }
    panel.innerHTML = sessions.map(s => `
      <div class="item-card" id="sc-${s.id}">
        <div class="item-header">
          <div class="item-icon chat-icon-bg" onclick="toggleChat('${s.id}', '${userId}')">💬</div>
          <div class="item-info" onclick="toggleChat('${s.id}', '${userId}')">
            <div class="item-name">${escHtml(s.name || "Untitled chat")}</div>
            <div class="item-meta">${s.message_count} messages · ${fmtDate(s.created_at)}</div>
          </div>
          <button class="del-btn" onclick="confirmDeleteChat('${s.id}', '${escHtml(s.name || "Untitled chat")}')" title="Delete chat">🗑</button>
          <div class="item-chevron" onclick="toggleChat('${s.id}', '${userId}')">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
        <div class="item-body">
          <div class="chat-messages" id="sm-${s.id}">
            <div class="loading"><div class="spinner"></div> Loading messages…</div>
          </div>
        </div>
      </div>
    `).join("");
  } catch (e) {
    panel.innerHTML = `<div class="empty" style="color:#f87171">Error: ${e.message}</div>`;
  }
}

async function toggleChat(sessionId, userId) {
  const card = document.getElementById(`sc-${sessionId}`);
  const msgsEl = document.getElementById(`sm-${sessionId}`);
  card.classList.toggle("expanded");
  if (card.classList.contains("expanded") && !msgsEl.dataset.loaded) {
    msgsEl.dataset.loaded = "1";
    try {
      const r = await api("GET", `/api/admin/users/${userId}/chats/${sessionId}`);
      const msgs = await r.json();
      if (!msgs.length) { msgsEl.innerHTML = `<div class="empty">No messages</div>`; return; }
      msgsEl.innerHTML = msgs.map(m => `
        <div class="msg ${m.role}">
          <div class="msg-role">${m.role === "user" ? "👤 User" : "🤖 AI"}</div>
          <div class="msg-bubble">${escHtml(m.content)}</div>
          <div class="msg-time">${fmtDate(m.created_at)}</div>
        </div>
      `).join("");
    } catch (e) {
      msgsEl.innerHTML = `<div class="empty" style="color:#f87171">Error: ${e.message}</div>`;
    }
  }
}

// ── Outputs ───────────────────────────────────────────────────────────────────

async function loadOutputs(userId) {
  const panel = document.getElementById("tab-outputs");
  panel.innerHTML = `<div class="loading"><div class="spinner"></div> Loading…</div>`;
  try {
    const r = await api("GET", `/api/admin/users/${userId}/outputs`);
    const outputs = await r.json();
    document.getElementById("cnt-outputs").textContent = outputs.length;
    if (!outputs.length) {
      panel.innerHTML = `<div class="empty"><svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>No saved outputs</div>`;
      return;
    }
    panel.innerHTML = outputs.map(o => `
      <div class="item-card" id="oc-${o.id}">
        <div class="item-header">
          <div class="item-icon out-icon-bg" onclick="toggleCard('oc-${o.id}')">✨</div>
          <div class="item-info" onclick="toggleCard('oc-${o.id}')">
            <span class="output-type-badge type-${o.type}">${o.type}</span>
            <div class="item-meta" style="margin-top:4px">${fmtDate(o.created_at)}</div>
          </div>
          <button class="del-btn" onclick="confirmDeleteOutput('${o.id}', '${o.type}')" title="Delete output">🗑</button>
          <div class="item-chevron" onclick="toggleCard('oc-${o.id}')">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
        <div class="item-body">
          <div class="output-content">${escHtml(
            typeof o.content === "string" ? o.content.trim() : JSON.stringify(o.content, null, 2)
          )}</div>
        </div>
      </div>
    `).join("");
  } catch (e) {
    panel.innerHTML = `<div class="empty" style="color:#f87171">Error: ${e.message}</div>`;
  }
}

// ── Toggle cards ──────────────────────────────────────────────────────────────

function toggleCard(id) {
  document.getElementById(id)?.classList.toggle("expanded");
}

// ── Delete confirmations ──────────────────────────────────────────────────────

function confirmDeleteUser() {
  if (!currentUser) return;
  confirm(
    "Delete user?",
    `Permanently delete "${currentUser.email}" and all their data? This cannot be undone.`,
    () => deleteUser(currentUser.id)
  );
}

function confirmDeleteUserById(userId, email) {
  confirm(
    "Delete user?",
    `Permanently delete "${email}" and all their data? This cannot be undone.`,
    () => deleteUser(userId)
  );
}

function confirmDeleteFile(fileId, name) {
  confirm("Delete file?", `Delete "${name}"?`, () => deleteFile(fileId));
}

function confirmDeleteChat(sessionId, name) {
  confirm("Delete chat?", `Delete "${name}" and all its messages?`, () => deleteChat(sessionId));
}

function confirmDeleteOutput(outputId, type) {
  confirm("Delete output?", `Delete this ${type} output?`, () => deleteOutput(outputId));
}

// ── Delete actions ────────────────────────────────────────────────────────────

async function deleteUser(userId) {
  try {
    const r = await api("DELETE", `/api/admin/users/${userId}`);
    if (!r.ok) throw new Error((await r.json()).error);
    allUsers = allUsers.filter(u => u.id !== userId);
    renderUserList(allUsers);
    if (currentUser?.id === userId) {
      currentUser = null;
      document.getElementById("user-detail").style.display = "none";
      document.getElementById("placeholder").style.display = "flex";
    }
    loadStats();
    toast("User deleted");
  } catch (e) {
    toast("Error: " + e.message, true);
  }
}

async function deleteFile(fileId) {
  try {
    const r = await api("DELETE", `/api/admin/files/${fileId}`);
    if (!r.ok) throw new Error((await r.json()).error);
    document.getElementById(`fc-${fileId}`)?.remove();
    const cnt = document.getElementById("cnt-files");
    cnt.textContent = Math.max(0, parseInt(cnt.textContent) - 1);
    loadStats();
    toast("File deleted");
  } catch (e) {
    toast("Error: " + e.message, true);
  }
}

async function deleteChat(sessionId) {
  try {
    const r = await api("DELETE", `/api/admin/chats/${sessionId}`);
    if (!r.ok) throw new Error((await r.json()).error);
    document.getElementById(`sc-${sessionId}`)?.remove();
    const cnt = document.getElementById("cnt-chats");
    cnt.textContent = Math.max(0, parseInt(cnt.textContent) - 1);
    loadStats();
    toast("Chat deleted");
  } catch (e) {
    toast("Error: " + e.message, true);
  }
}

async function deleteOutput(outputId) {
  try {
    const r = await api("DELETE", `/api/admin/outputs/${outputId}`);
    if (!r.ok) throw new Error((await r.json()).error);
    document.getElementById(`oc-${outputId}`)?.remove();
    const cnt = document.getElementById("cnt-outputs");
    cnt.textContent = Math.max(0, parseInt(cnt.textContent) - 1);
    loadStats();
    toast("Output deleted");
  } catch (e) {
    toast("Error: " + e.message, true);
  }
}
